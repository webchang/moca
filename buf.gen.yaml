# buf.gen.yaml — reproducible codegen. Regenerate with `buf generate`.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rossoctl/moca/gen/go
plugins:
  # TypeScript (backend) — grpc-js service defs + message types.
  - remote: buf.build/community/stephenh-ts-proto:v2.6.1
    out: packages/k8s-sandbox/src/gen
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - forceLong=number
      - useOptionals=none
    exclude_types:
      - egress.v1
  # TypeScript (SBX0 clients) -- the same stubs for @moca/sandbox-client, which mocactl bundles
  # without depending on @moca/k8s-sandbox (ADR-0042).
  - remote: buf.build/community/stephenh-ts-proto:v2.6.1
    out: packages/sandbox-client/src/gen
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - forceLong=number
      - useOptionals=none
    exclude_types:
      - egress.v1
  # Go (worker) — messages + gRPC service stubs.
  - remote: buf.build/protocolbuffers/go:v1.36.4
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt:
      - paths=source_relative
