# The workers call the provisioner with its service token and the caller's own API token (spec
# §4.1). With MOCA_PROVISIONER_URL set, POST /workloads accepts `sandboxes`.
apiVersion: apps/v1
kind: Deployment
metadata: { name: moca-supervisor, namespace: moca }
spec:
  template:
    spec:
      containers:
        - name: supervisor
          env:
            - { name: MOCA_PROVISIONER_URL, value: 'http://moca-provisioner.moca.svc:8080' }
            - name: MOCA_PROVISIONER_TOKEN
              valueFrom: { secretKeyRef: { name: moca-provisioner, key: MOCA_PROVISIONER_TOKEN } }
            # Spec §6.3: the workers' half of the per-workload cap; the provisioner enforces it too.
            - { name: MOCA_WORKLOAD_MAX_SANDBOXES, value: '2' }
            # A mounted workload's PVC (spec §6.3): the provisioner checks both again. setup.sh sets
            # the StorageClasses, on both, from SH_WORKLOAD_STORAGE_CLASSES.
            - { name: MOCA_WORKLOAD_MAX_STORAGE, value: 10Gi }
            - { name: MOCA_WORKLOAD_STORAGE_CLASSES, value: '' }
            # The bundle ceilings a mounted workload's seed is downloaded and handed over with: the
            # provisioner's (provisioner.yaml) must be the same. Patch both together.
            - { name: MOCA_CONTEXT_BUNDLE_MAX_BYTES, value: '268435456' }
            - { name: MOCA_CONTEXT_BUNDLE_MAX_ENTRIES, value: '10000' }
