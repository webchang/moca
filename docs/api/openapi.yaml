# The MU1 /v1 contract, delivered as a product surface rather than as prose
# (spec §4). Pinned by packages/control-plane/test/openapi-contract.test.ts, which
# asserts this document and src/routes.ts describe the same route table -- without
# it, "API as a product" degrades into documentation that lies (spec §9.3 test 3).
#
# Two conventions this document follows (spec §4.1):
#   * THE PRINCIPAL IS NEVER IN A PATH. /v1/sessions means MY sessions, derived
#     from the token. Admin listing is ?owner=<subject>, gated on a role claim.
#   * NO CREDENTIAL VALUE IS EVER RETURNED. PUT is write-only and there is no
#     read-back path at all.
openapi: 3.1.0
info:
  title: MOCA control plane
  version: 1.10.0
  description: |
    Multi-user control plane: authenticated API, owned sessions, per-user credentials (MU1).
    This document covers the CONTROL PLANE's routes only. The data plane also serves `/v1` paths
    -- `/v1/turn` and `/v1/runs` -- and they are described in
    harness-openapi.yaml, this document's twin; "the `/v1` API contract" in spec §1/§4 is
    therefore split across the two files.
    `/internal/credentials` is the data-plane-only credential exchange and is not part of the
    public surface; it is documented here because it is part of the contract between the tiers.
servers:
  - url: http://sh-control-plane.default.svc:8080
    description: in-cluster
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Ed25519 (`alg: EdDSA`) JWT minted by the control plane. Two shapes: an API token
        (`scope: ["api"]`, 15 minutes, renewed at /v1/auth/token) for `/v1` routes, and a session token (`scope: ["turn:write"]`
        plus `sid`, 5 minutes) for the data plane's `/turn`. No credential travels in the token.
    exchangeToken:
      type: http
      scheme: bearer
      description: The shared `SH_EXCHANGE_TOKEN`, mounted into both tiers from one Secret.
    janitorToken:
      type: http
      scheme: bearer
      description: |
        The sandbox host janitor's `SH_JANITOR_TOKEN` (SBX0 §8.3); admits GET /v1/janitor/sandboxes
        only. No user or admin API token is accepted there, and with none configured every call is
        refused.
    egress:
      type: http
      scheme: bearer
      description: |
        One KVM host's egress token (`SH_EGRESS_TOKEN_<ID>`, SBX0.2b §4.2); admits
        POST /v1/egress/credential only. Compared against every configured host; no user,
        admin or janitor token is accepted there.
    hostToken:
      type: http
      scheme: bearer
      description: |
        One template host agent's token (`SH_HOST_TOKEN_<ID>`, `SH_TEMPLATE_HOSTS`; template
        lifecycle spec §6.1); admits the /v1/hosts/{host}/ routes for that host only. Distinct
        from every egress and janitor token; no user or admin token is accepted there.
  parameters:
    sessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    credentialName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
    sandboxId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^sbx-[0-9a-f]{26}$'
  schemas:
    RetiredBuild:
      type: object
      description: One build a retire answered for, with what ties it to the trace
      required: [build, buildId, readiness, record]
      properties:
        build: { type: string, description: the build's handle (its build id once registered) }
        buildId:
          {
            type: [string, 'null'],
            description: 'the build id; null for one retired before it registered',
          }
        readiness: { type: string, enum: [retired] }
        record:
          {
            type: [string, 'null'],
            description: 'the retire record written now (sha256:...); null if already retired',
          }
    WantedWorker:
      type: object
      required: [template, buildId, worker]
      properties:
        template: { type: string }
        buildId: { type: string }
        worker: { type: string, description: the relay sandbox id of the build's worker }
    TemplateCreate:
      type: object
      required: [image, spec]
      properties:
        id: { type: string, description: 'the template id (lowercased); ignored on /{id}/builds' }
        image: { type: string, description: 'repository@sha256:<64 hex>, from an allowed registry' }
        spec:
          type: object
          description: |
            the template spec template-build.sh reads (deploy/sbx/template-onboarding/ONBOARDING.md):
            guest_mb (or guest_ram_mb), vcpus, workspace_mb?, egress, seed, probe, tools,
            description, and optionally guest_home, skip_git_identity_check, guest_home_gitconfig,
            probe_status, source_record_digest
        profile: { type: string, description: a policy profile; the policy's default when absent }
        gateRecord:
          type: string
          description: the image's gate record file, byte for byte (its sha256 is what the policy trusts)
        visibility: { type: string, enum: [private, deployment] }
    TemplateQueued:
      type: object
      required: [templateId, buildId, build, status]
      properties:
        templateId: { type: string }
        buildId:
          type: [string, 'null']
          description: null until registered; then the manifest hash (a reused registered build)
        build:
          type: string
          description: the build to follow (its provisional handle b-<26 hex>, or its buildId once registered)
        status:
          type: string
          enum: [queued, building, probing, built, registered]
          description: "`queued` for a new build; a reused build's own status"
        reused:
          type: boolean
          description: |
            true when the create matched a build of the same inputs (image, spec, profile, gate record's
            sha256) that is registered or on its way there (§3.2): that build is answered, and no second
            one is queued. A registered build counts only while a host holds its snapshot (G29). Absent for a new build.
    LimitUse:
      type: object
      required: [limit, used]
      properties:
        limit: { type: integer }
        used: { type: integer }
    Policy:
      type: object
      description: The template policy (template lifecycle spec §8); schema moca-template-policy/1
      required: [schema, profiles, defaultProfile, allowedRegistries, trustedGateRecords, quota]
      properties:
        schema: { type: string, enum: [moca-template-policy/1] }
        profiles:
          type: object
          additionalProperties:
            type: object
            required: [requires, envelope]
            properties:
              requires: { type: array, items: { type: string }, description: gating rule ids }
              selfAttest:
                type: boolean
                description: |
                  register G41 (c): a gate record the policy does not trust still passes X1.trusted
                  when the creating subject submitted it, for that subject's own templates only. The
                  build is self-attested: private, its commits always refused (X12 strict), never
                  deployment-visible until an admin adds the record's sha256 to trustedGateRecords.
                  Absent: false. The default policy holds `benchmark-self` and `general-self`
              selfAttestEgress:
                type: boolean
                description: |
                  on a self-attested record only, whether spec.egress may be true (the KVM host's
                  allowlisted egress, never unrestricted). Absent: false. `benchmark-self` keeps it
                  false (benchmark integrity); `general-self` sets it
              requireOfflineGate:
                type: boolean
                description: |
                  whether the gate's test floor must have been checked offline (X1.offline). A
                  general-gate record (`image-factory/gate/1`) needs `gate.floor_checked_offline:
                  true` (fail closed); a curated family record predates the field and passes without
                  it. Absent: true on a profile that requires X1; `general-self` sets it false
              envelope:
                type: object
                required: [maxGuestMb, maxVcpus, maxWorkspaceMb]
                properties:
                  maxGuestMb: { type: integer }
                  maxVcpus: { type: integer }
                  maxWorkspaceMb: { type: integer }
                  exact:
                    type: object
                    properties:
                      guestMb: { type: integer }
                      vcpus: { type: integer }
        defaultProfile: { type: string }
        allowedRegistries:
          type: array
          items: { type: string }
          description: |
            registry hosts. `<default>` is a reference with no host, which the build host pulls from
            its own configured registry; Docker Hub is `docker.io` (`index.docker.io` reads as it)
        allowedRepositories:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items: { type: string }
          description: |
            Optional, per registry (a key of `allowedRegistries`): the repositories an image may come
            from there, each an exact path (`library/python`) or a prefix (`library/*`), matched on
            whole path segments. A registry with no entry allows every repository it serves. A Docker
            Hub official name (`python`) reads as `library/python`. A refusal is rule
            `registry.repository`.
        trustedGateRecords:
          type: array
          items: { type: string }
          description: sha256 digests of the gate records the benchmark profile trusts
        quota: { $ref: '#/components/schemas/Quota' }
        quotaBySubject:
          type: object
          description: per-subject overrides of `quota` (an admin's, `PUT /v1/quota/{subject}`)
          additionalProperties: { $ref: '#/components/schemas/Quota' }
    Quota:
      type: object
      required: [templates, buildsQueued, active]
      properties:
        templates: { type: integer, minimum: 0 }
        buildsQueued: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
    PolicyView:
      type: object
      required: [policy, digest, record]
      properties:
        policy: { $ref: '#/components/schemas/Policy' }
        digest: { type: string }
        record: { type: string, description: the provenance policy record's digest }
    Template:
      type: object
      description: A template (template lifecycle spec §3.2, §4)
      required: [id, description, tools, owner, visibility, onboarding, readiness, tags, builds]
      properties:
        id: { type: string }
        description: { type: string }
        tools:
          type: array
          items: { type: string }
          description: the default build's tools
        owner:
          type: [string, 'null']
          description: the owning subject; null for a template the deployment declared
        visibility:
          type: string
          enum: [private, deployment]
          description: |
            in effect: `private` while any registered build is self-attested now (register G41,
            a trust removal narrows a template on the next read), else as set
        attestation:
          type: string
          enum: [deployment, self]
          description: '`self` when any registered build is self-attested now (G41)'
        onboarding:
          type: [string, 'null']
          description: "`registered` once any build is; else the newest build's status"
        readiness:
          type: [string, 'null']
          description: the default build's readiness
          enum: [active, activating, deactivating, inactive, unavailable, unknown, retired, null]
        readinessReason:
          $ref: '#/components/schemas/ReadinessReason'
        tags:
          type: object
          additionalProperties: { type: string }
          description: tag -> buildId; `default` is what a bare id names
        builds:
          type: array
          items: { $ref: '#/components/schemas/TemplateBuild' }
    ReadinessReason:
      type: string
      enum: [not_held, no_slot, memory, memfile_mismatch]
      description: |
        present only with readiness `unavailable` (1.8.0, register G39): why placement left the
        build waiting. `not_held` no host holds its snapshot; `no_slot` every holder is at its
        active limit; `memory` a holder under its limit has no memory headroom for the worker now
        (memory-aware placement spec §4: its floor, a pressure brake, or an inventory older than
        60 s); `memfile_mismatch` every holder reports the snapshot's memory file is not the guest's
        size (a rebuild clears it, not a wait)
    TemplateBuild:
      type: object
      description: One build of a template, an immutable snapshot (template lifecycle spec §3.2, §3.3)
      required:
        [
          buildId,
          handle,
          status,
          profile,
          readiness,
          capacity,
          lastUsedAt,
          tags,
          createdAt,
          provenance,
          reason,
        ]
      properties:
        buildId: { type: string, description: '`sha256:<manifest hash>` or `imported:<12 hex>`' }
        handle:
          type: string
          description: |
            the `b-<26 hex>` handle the create answered (equal to buildId for an imported build);
            /builds/{build} resolves it before and after registration
        reason:
          type: [object, 'null']
          description: on failed or rejected, why
          required: [message]
          properties:
            message: { type: string }
            step: { type: string, description: 'failed: the build step' }
            rule:
              {
                type: string,
                description: 'rejected: the registration rule (S.hash, T.gate_record, ...)',
              }
        status:
          type: string
          enum: [queued, building, probing, built, registered, rejected, failed, retired]
        profile: { type: string, description: the policy profile; `imported` for the env list's }
        readiness:
          type: [string, 'null']
          enum: [active, activating, deactivating, inactive, unavailable, unknown, retired, null]
          description: |
            for a registered build (§3.3): `active` its worker is attached to the relay;
            `activating` leased and placed on a host, not attached yet; `deactivating` attached,
            no lease left (draining); `inactive` neither; `unavailable` leased, but no host holds
            it or every holder is full; `unknown` the relay's presence could not be read; `retired`
            for a retired build; null for any other build that is not registered
        readinessReason:
          $ref: '#/components/schemas/ReadinessReason'
        queued:
          type: boolean
          description: |
            1.9.0 (cold-start pacing spec §4, register G43), present only with readiness
            `activating` on a host whose agent reports its start limit: true while the build waits
            for a start slot (its place in the host's start line is beyond the host's
            startConcurrency), false once its worker is starting. A queued build stays `activating`
            longer than before: poll with a timeout sized for the host's whole start line
        queuePosition:
          type: integer
          minimum: 1
          description: |
            1.9.0 (register G43), with `queued`: the build's 1-based place among its host's placed,
            wanted builds not attached yet, first leased first; the first startConcurrency are
            starting
        graced:
          type: boolean
          enum: [true]
          description: |
            1.10.0 (cold-start pacing spec §4, register G43), present only while the build is in its
            host's idle grace: no lease left, and its worker kept running (readiness `deactivating`)
            until `gracedUntil`, unless a wanted build needs its slot, a retire or reject ends it, or
            a release with `stopNow` does. A use within the grace finds it active, with no cold start
        gracedUntil:
          type: integer
          description: 1.10.0 (register G43), with `graced`, epoch seconds the grace ends (its last lease's end plus the host's idleGraceSeconds)
        capacity:
          type: [object, 'null']
          description: for an active build
          required: [running, inUse]
          properties:
            running: { type: integer, description: the sandboxes its worker advertises at once }
            inUse:
              type: [integer, 'null']
              description: |
                its live sandboxes now; null on the harness profile, which holds no sandbox
                records (sessions name a template, not a worker)
        lastUsedAt:
          type: [integer, 'null']
          description: |
            epoch seconds of the newest sandbox created on it (retained records included); null
            when it has none, and on the harness profile
        attestation:
          type: string
          enum: [deployment, self]
          description: |
            register G41 (c), recomputed on every read from the current policy: `self` when the build
            was created on a selfAttest profile with a gate record trustedGateRecords does not list;
            `deployment` otherwise (a promotion or removal of the record changes it, nothing rewritten)
        gateFloorCheckedOffline:
          type: [boolean, 'null']
          description: |
            its gate record's `gate.floor_checked_offline` (true for a curated family record, which
            predates the field); false only on a profile that allows it (`general-self`); null with
            no gate record
        gateFloorMetOffline:
          type: boolean
          description: |
            present only for a gate from a `network_needed` contract: its `gate.floor_met_offline`,
            whether the offline run met the floor anyway
        heldBy:
          type: [array, 'null']
          items: { type: string }
          description: |
            the ids of the hosts whose last inventory holds this build's snapshot (template lifecycle
            spec §6.1), sorted; no paths. A retired build's host drops out once it has removed it.
            `[]` when no host holds it; null on a deployment without host agents
        tags: { type: array, items: { type: string } }
        createdAt: { type: integer, description: epoch seconds }
        provenance:
          type: [string, 'null']
          description: the digest of the provenance record that created it
        spec:
          type: object
          description: on GET /v1/templates/{id} and the builds routes only
          properties:
            guest_mb: { type: integer }
            vcpus: { type: integer }
            workspace_mb: { type: integer }
            seed: { type: string }
            tools: { type: array, items: { type: string } }
    Subject:
      type: object
      required: [subject, enrolled, source, roles]
      properties:
        subject: { type: string, pattern: '^github:[0-9]+$' }
        enrolled: { type: boolean }
        source:
          type: string
          enum: [env, api]
          description: "`env`: the deployment's settings; `api`: the members store"
        roles:
          type: array
          items:
            type: object
            required: [role, source, until, by]
            properties:
              role: { type: string, enum: [admin] }
              source: { type: string, enum: [env, api] }
              until: { type: [integer, 'null'], description: epoch seconds; null for no expiry }
              by: { type: [string, 'null'], description: the admin who granted it (null for env) }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          # A real enum, NOT a prose list: this is the half a client generator and a schema validator
          # consume, and the half openapi-contract.test.ts compares against CP_ERROR_CODES. Keep it
          # sorted the same way as the source array for a readable diff when a code is added.
          enum:
            - invalid_json
            - invalid_request
            - token_required
            - token_invalid
            - token_expired
            - invalid_grant
            - subject_conflict
            - unauthorized
            - forbidden
            - not_found
            - session_not_found
            - session_mismatch
            - not_enrolled
            - sandbox_not_found
            - sandbox_terminated
            - name_conflict
            - credential_unsafe
            - destination_conflict
            - destination_ambiguous
            - no_credential
            - quota_exceeded
            - unknown_template
            - template_not_found
            - template_exists
            - policy_refused
            - no_active_slot
            - template_unavailable
            - template_not_active
            - template_retired
            - build_in_use
            - self_attested
            - bootstrap_subject
            - self_revoke
            - digest_mismatch
            - bundle_quota_exceeded
            - config_bundle_not_found
            - configRef_invalid
            - credential_required
            - credential_ambiguous
            - credential_not_found
            - credential_unavailable
            - endpoint_unresolved
            - model_unavailable
            - model_catalog_unavailable
            - authorization_pending
            - device_code_expired
            - identity_provider_misconfigured
            - redis_unavailable
            - internal_error
          description: snake_case error code.
        message:
          type: string
          description: |
            Human-readable detail. ABSENT on `internal_error` by design -- an arbitrary error's text
            can carry a Redis connection string or a presented token, and this body reaches an
            arbitrary caller (errors.ts).
        sessionId: { type: string }
        reason:
          type: string
          description: |
            sandbox_terminated: deleted | expired. no_active_slot: `memory` when no holder under its
            active limit has the memory for the worker (1.8.0, register G39; absent at the active
            limit, as before). template_unavailable: `memfile_mismatch` when every holder reports the
            snapshot's memory file is not the guest's size. template_not_active with readiness
            `unavailable`: the build's readinessReason
        readiness:
          type: string
          description: "template_unavailable, no_active_slot and template_not_active: the build's readiness"
        rule:
          type: string
          description: |
            policy_refused only: the gating rule the create failed (M1, M7.id, M8, M9, registry,
            envelope, profile, X1, X1.trusted, X10, X10.record, X11, X12, X14, X15; governance
            GATING-RULES.md)
        quota:
          type: string
          enum: [templates, buildsQueued, active]
          description: 'quota_exceeded on a template create or activation: which quota'
    Session:
      type: object
      required: [sessionId, owner, tenant, createdAt, state, turns]
      properties:
        sessionId: { type: string }
        owner: { type: string, description: 'github:<numeric id>' }
        tenant: { type: string }
        createdAt: { type: integer, description: epoch ms }
        state: { type: string, enum: [active, deleting] }
        configRef:
          { type: [string, 'null'], description: recorded at creation; not a liveness signal }
        lastTurnAt: { type: [integer, 'null'] }
        turns: { type: integer }
        sandboxTier:
          type: [string, 'null']
          description: |
            the sandbox tier the session runs in (P6.3): the tier recorded at creation; for a
            session that recorded none (created before P6.3, or while the deployment declared no
            tiers), today's deployment default, which the data plane applies; null whenever the
            deployment declares no tiers, even for a session that recorded one (the data plane
            then runs untiered)
        sandboxTemplate:
          type: [string, 'null']
          description: |
            the sandbox template the session runs on (session-templates spec §3.3): present only on
            a deployment that declares templates (SH_SANDBOX_TEMPLATES); null there for a session
            with none, or whose template is no longer declared
        sandboxBuildId:
          type: [string, 'null']
          description: |
            with sandboxTemplate: the build the session resolved its template to at creation
            (`id@sha256:…` pins one; `id` and `id:tag` take the tag's), template lifecycle spec §9;
            null without a template catalog. A manifest-hash build pins the session's turns to
            workers serving it (`moca.dev/build`, combined control plane spec §3.4, register G19);
            an `imported:` build routes by template only
        templateManifestHash:
          type: [string, 'null']
          description: with sandboxTemplate, the manifest hash of sandboxBuildId; null for an imported build
        model:
          type: [string, 'null']
          description: |
            the model the session's turns run on, as chosen at creation or by PATCH; null when it
            runs on the deployment default
    CredentialDescriptor:
      type: object
      required: [name, kind, consumer, destination, binding]
      properties:
        name: { type: string }
        kind:
          {
            type: string,
            description: 'registry entry: bearer | basic | api-key | oauth2-token | …',
          }
        consumer: { type: string, enum: [inference, sandbox-egress, control-plane] }
        destination:
          type: object
          required: [hosts]
          properties:
            hosts:
              type: array
              items: { type: string }
              description: host allow-list, not a base URL
        binding:
          oneOf:
            - type: object
              required: [header, format]
              properties:
                header: { type: string }
                format: { type: string }
            - type: array
              minItems: 1
              maxItems: 4
              items:
                type: object
                required: [header, format]
                properties:
                  header: { type: string }
                  format: { type: string }
        endpoint:
          type: [string, 'null']
          maxLength: 2048
          description: full gateway origin; meaningful only for consumer `inference`
    ModelList:
      type: object
      required: [credential, models]
      properties:
        credential:
          {
            type: string,
            description: 'the credential listed for; operator-fallback for the fallback',
          }
        models:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              contextWindow: { type: integer }
              maxTokens: { type: integer }
              reasoning: { type: boolean }
              vision: { type: boolean }
    EgressEvent:
      description: |
        One audit event of the KVM host's egress proxy (`moca-egress`, remote-worker
        internal/egress/audit.go `Event`), exactly as it wrote it; no other field is accepted or
        stored. `path` carries no query, fragment or userinfo; `credential` is a name, never a value.
      type: object
      additionalProperties: false
      required: [time, via, decision]
      properties:
        time: { type: string, description: RFC 3339 }
        via: { type: string, enum: [moca-egress] }
        vm_id: { type: string }
        sid: { type: string, description: "the sandbox's workspace key" }
        sub: { type: string }
        host: { type: string }
        dial_addr: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        bytes_up: { type: integer }
        bytes_down: { type: integer }
        credential: { type: string }
        decision:
          { type: string, description: 'tunnel, forward, destination_denied, audit_dropped, ...' }
        dropped: { type: integer }
        coalesced: { type: integer }
    EgressSummary:
      type: object
      required: [byHost, total, dropped, droppedBy, complete, sealed, sha256]
      properties:
        byHost:
          type: object
          additionalProperties:
            type: object
            required: [count, decisions, bytesUp, bytesDown]
            properties:
              count: { type: integer }
              decisions: { type: object, additionalProperties: { type: integer } }
              bytesUp: { type: integer }
              bytesDown: { type: integer }
        total: { type: integer, description: events stored }
        dropped: { type: integer, description: 'droppedBy summed: the events this log may lack' }
        droppedBy:
          type: object
          required: [proxy, cap, budget, invalid]
          properties:
            proxy: { type: integer, description: "charged by the proxy's audit_dropped reports" }
            cap: { type: integer, description: 'over the 10,000-event cap per log' }
            budget:
              type: integer
              description: "over the deployment's 200,000-event budget for all logs together"
            invalid: { type: integer, description: named this sandbox but were not a proxy Event }
        complete: { type: boolean, description: dropped is 0 }
        sealed:
          { type: boolean, description: 'past the 600 s grace after the end: takes no more events' }
        sha256:
          type: string
          description: |
            sha256: + the hex sha256 of the NDJSON export: each stored event's canonical JSON
            (the provenance canonicalization: keys sorted, no whitespace), each followed by one \n,
            in arrival order. The empty log's is the sha256 of no bytes.
    Sandbox:
      type: object
      description: A sandbox (SBX0 §5.1). Times are epoch seconds.
      required:
        [
          id,
          owner,
          name,
          template,
          buildId,
          templateManifestHash,
          state,
          reason,
          createdAt,
          expiresAt,
          terminatedAt,
          labels,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^sbx-[0-9a-f]{26}$'
          description: '`sbx-` plus 26 random lowercase hex characters; also the workspace key'
        owner: { type: string, description: 'github:<numeric id>' }
        name:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          description: unique among the owner's live sandboxes; null when unnamed
        template: { type: string }
        buildId:
          type: [string, 'null']
          description: |
            the build the template reference (id, id:tag or id@sha256:...) resolved to at creation,
            kept for the sandbox's life (template lifecycle spec §9); null on a sandbox created
            before tracing
        templateManifestHash:
          type: [string, 'null']
          description: |
            the snapshot's manifest hash (the build id of a built build); null for a template
            imported from SH_SANDBOX_TEMPLATES, which names no snapshot. A run's result traces:
            run -> manifest hash -> build record -> gate record
        state: { type: string, enum: [ready, terminated] }
        reason:
          type: [string, 'null']
          enum: [deleted, expired, null]
          description: why it terminated; null while ready
        createdAt: { type: integer, description: epoch seconds }
        expiresAt:
          type: integer
          description: |
            epoch seconds, fixed at create (no extension in SBX0). Expiry is computed: past it, the
            sandbox reads as terminated / expired everywhere and refuses to mint (SBX0 §5.2).
        terminatedAt:
          type: [integer, 'null']
          description: epoch seconds; the delete time or expiresAt; null while ready
        labels:
          type: object
          maxProperties: 16
          propertyNames: { pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
          additionalProperties: { type: string }
          description: free-form string pairs (at most 16; each value at most 256 UTF-8 bytes)
  responses:
    Unauthorized:
      description: no token, a bad token, or a failed exchange or janitor authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        Unknown session (or sandbox), or one owned by someone else -- deliberately
        indistinguishable. 404 rather than 403, because a 403 is an existence oracle (spec §8.1).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotEnrolled:
      description: '`not_enrolled`: the caller is not in SH_ALLOWED_SUBJECTS (SBX0 §4.2)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: a typed validation or policy refusal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        '200': { description: ok }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness — whether Redis is answering
      description: |
        Credentials live in Kubernetes Secrets, so they stay available while Redis is down
        (spec §7.1, §9.2). This probe therefore reports only the session index.
      security: []
      responses:
        '200': { description: ready }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/discovery:
    get:
      operationId: getDiscovery
      summary: Where a client finds the rest of the deployment
      description: |
        Public and unauthenticated: a client reads it before logging in, so that the control-plane
        URL is the only address a user has to know. `harnessUrl` is the harness base URL as a
        client reaches it, set by the operator with SH_PUBLIC_HARNESS_URL. It is `null` when the
        deployment advertises none; a 404 means a control plane that predates this route.
        `sandboxTiers` (P6.3) is always present; a control plane that predates P6.3 omits it.
        `version` is always present; a control plane that predates advertising one omits it.
        `profile` names the control plane's route profile; on `sandbox`, `execEndpoint` and `execCa`
        say where to send Exec and which CA to trust (SBX0 §4.1). A `sandbox` control plane answers
        only `profile`, `execEndpoint` and, when the exec certificate is self-issued, `execCa`;
        templates are at the fixed `/v1/templates`. A control plane that predates profiles omits
        `profile`, and is a `harness` one.
      security: []
      responses:
        '200':
          description: the advertised endpoints
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: the harness profile (the default)
                    required: [harnessUrl, sandboxTiers, version]
                    properties:
                      harnessUrl:
                        type: [string, 'null']
                        description: absolute http(s) URL, no trailing slash
                      sandboxTiers:
                        type: [object, 'null']
                        description: |
                          the tiers a session may ask for at creation (SH_SANDBOX_TIERS) and the
                          default; null when none are declared
                        required: [names, default]
                        properties:
                          names: { type: array, items: { type: string } }
                          default: { type: string }
                      sandboxTemplates:
                        type: array
                        description: |
                          the templates a session may name at creation (SH_SANDBOX_TEMPLATES),
                          without their seeds; absent when the deployment declares none
                        items:
                          type: object
                          required: [id, description, tools]
                          properties:
                            id: { type: string }
                            description: { type: string }
                            tools: { type: array, items: { type: string } }
                      version:
                        type: [string, 'null']
                        description: |
                          the deployment's version (MOCA_VERSION, baked in at image build), so a client
                          can show it; `dev` when nothing was baked in, and `null` permitted for
                          compatibility with a control plane that reports none
                      profile:
                        type: string
                        enum: [harness, combined]
                        description: |
                          `combined` (combined control plane spec §3.1) serves sessions and sandboxes:
                          its body adds `execEndpoint` and `execCa`, as the sandbox profile's
                      execEndpoint:
                        type: string
                        description: combined profile only -- host:port of the exec Route
                      execCa:
                        type: string
                        description: combined profile only -- PEM of a self-issued exec certificate
                  - type: object
                    description: the sandbox profile (SBX0 §4.1)
                    required: [profile, execEndpoint]
                    additionalProperties: false
                    properties:
                      profile: { type: string, enum: [sandbox] }
                      execEndpoint:
                        type: string
                        description: sandbox profile only -- host:port of the exec Route
                      execCa:
                        type: string
                        description: |
                          sandbox profile only -- PEM of a self-issued exec certificate; absent when
                          the certificate chains to a public CA
  /v1/auth/device:
    post:
      operationId: startDeviceAuth
      summary: Start a GitHub OAuth device-flow login
      description: |
        GitHub's user-login flow is plain OAuth 2.0, not OIDC (spec §5.1). The device flow is what a
        shell script can complete, and it needs no client secret. The GitHub OAuth app must have
        device flow ENABLED -- it is off by default (spec §5.1.1).
      security: []
      responses:
        '200':
          description: the code the operator types at verificationUri
          content:
            application/json:
              schema:
                type: object
                required: [deviceCode, userCode, verificationUri, interval, expiresIn]
                properties:
                  deviceCode: { type: string }
                  userCode: { type: string }
                  verificationUri: { type: string }
                  interval: { type: integer }
                  expiresIn: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: |
            identity_provider_misconfigured -- GitHub refused the control plane's OAuth app: device
            flow is off, or SH_GITHUB_CLIENT_ID names no app. An operator fix; `message` says which.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/device/token:
    post:
      operationId: completeDeviceAuth
      summary: Exchange an approved device code for an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode: { type: string }
                label:
                  type: string
                  maxLength: 64
                  description: a client hint such as the hostname; shown back, never trusted
      responses:
        '200':
          description: an api-scoped token
          content:
            application/json:
              schema:
                type: object
                required: [token, subject, expiresAt, refreshToken, refreshExpiresAt]
                properties:
                  token: { type: string }
                  subject: { type: string }
                  displayName: { type: string }
                  roles: { type: array, items: { type: string } }
                  expiresAt: { type: integer, description: epoch seconds }
                  refreshToken:
                    type: string
                    pattern: '^mrt_[A-Za-z0-9_-]{43}$'
                    description: opaque, single-use; exchange at /v1/auth/token for the next pair
                  refreshExpiresAt:
                    { type: integer, description: epoch seconds; the login's absolute limit }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '428':
          description: authorization_pending — the user has not approved yet; poll again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            Sandbox profile only: `not_enrolled` -- the approving GitHub account is not in
            SH_ALLOWED_SUBJECTS and is not an admin (SBX0 §4.2). No refresh family is issued. The
            `message` names the caller's own subject (`github:<id>`) for an operator to enroll.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: device_code_expired — the code expired before it was approved; start a new one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/test-token:
    post:
      operationId: testUserToken
      summary: Log in as a configured test user, without the GitHub device flow (dev/test only)
      description: |
        Present only when the control plane was started with `SH_TEST_USERS=N` (ADR-0045); without
        it every request answers 404, so the path is invisible in an ordinary deployment. Requires
        the shared secret `SH_TEST_USER_SECRET`, because the endpoint issues a real login for an
        arbitrary `test:<index>` subject.

        The reply is the SAME body as `/v1/auth/device/token`: a test user gets a refresh family,
        the configured token TTLs and its roles from `SH_ADMIN_SUBJECTS`, so it is configured
        exactly like a GitHub user everywhere downstream. Refused on the sandbox profile, which
        the control plane will not even boot with test users enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index, secret]
              properties:
                index:
                  type: integer
                  minimum: 1
                  description: 1-based; must be <= SH_TEST_USERS. The subject is `test:<index>`.
                secret:
                  type: string
                  description: must equal SH_TEST_USER_SECRET; compared in constant time
                label:
                  type: string
                  maxLength: 64
                  description: a client hint such as the hostname; shown back, never trusted
      responses:
        '200':
          description: an api-scoped token, the same shape /v1/auth/device/token returns
          content:
            application/json:
              schema:
                type: object
                required: [token, subject, expiresAt, refreshToken, refreshExpiresAt]
                properties:
                  token: { type: string }
                  subject: { type: string, pattern: '^test:[0-9]+$' }
                  displayName: { type: string }
                  roles: { type: array, items: { type: string } }
                  expiresAt: { type: integer, description: epoch seconds }
                  refreshToken:
                    type: string
                    pattern: '^mrt_[A-Za-z0-9_-]{43}$'
                    description: opaque, single-use; exchange at /v1/auth/token for the next pair
                  refreshExpiresAt:
                    { type: integer, description: epoch seconds; the login's absolute limit }
        '400':
          description: |
            invalid_request -- `index` is missing, not an integer, or outside 1..SH_TEST_USERS.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            unauthorized -- the shared credential in the request was missing or did not match. One
            code for both, and checked before `index`, so a prober learns neither which half is
            wrong nor how many test users exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            not_found -- this control plane has no test users configured (`SH_TEST_USERS` unset).
            Deliberately indistinguishable from an unrouted path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/token:
    post:
      operationId: refreshAuth
      summary: Exchange a refresh token for a new API token and a new refresh token (RFC 6749 §6)
      description: |
        Every use rotates the refresh token. Presenting the one just replaced within
        SH_REFRESH_REUSE_GRACE_SECONDS answers the same successor again; presenting any older one
        revokes the whole login (reuse detection). Every outcome is audited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, refresh_token]
              properties:
                grant_type: { type: string, enum: [refresh_token] }
                refresh_token: { type: string }
      responses:
        '200':
          description: the same body as /v1/auth/device/token
          content:
            application/json:
              schema:
                type: object
                required: [token, subject, expiresAt, refreshToken, refreshExpiresAt]
                properties:
                  token: { type: string }
                  subject: { type: string }
                  displayName: { type: string }
                  roles: { type: array, items: { type: string } }
                  expiresAt: { type: integer, description: epoch seconds }
                  refreshToken: { type: string, pattern: '^mrt_[A-Za-z0-9_-]{43}$' }
                  refreshExpiresAt: { type: integer, description: epoch seconds }
        '400':
          description: invalid_request, or invalid_grant — the refresh token is unknown, revoked, expired or replayed; log in again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            Sandbox profile only: `not_enrolled` -- the login's subject was removed from
            SH_ALLOWED_SUBJECTS since it logged in (SBX0 §4.2). The control plane revokes the login
            (audited `refresh_revoked`, reason `not_enrolled`), so the refresh token presented is
            refused from then on; the client should forget it. The `message` names the subject.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/revoke:
    post:
      operationId: revokeAuth
      summary: Revoke the login a refresh token belongs to (RFC 7009)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: always, whether or not the token named a login
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/revoke-all:
    post:
      operationId: revokeAllAuth
      summary: Revoke every login of the calling subject
      security: [{ sessionToken: [] }]
      responses:
        '200':
          description: how many logins were revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/me:
    get:
      operationId: getMe
      summary: The calling principal
      security: [{ sessionToken: [] }]
      responses:
        '200':
          description: subject, tenant, roles
          content:
            application/json:
              schema:
                type: object
                required: [subject, tenant, roles]
                properties:
                  subject: { type: string }
                  tenant: { type: string }
                  roles: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/models:
    get:
      operationId: listModels
      summary: The models an inference credential reaches
      description: |
        Asked of the credential's own endpoint: LiteLLM's /model/info, or Anthropic's /v1/models for
        api.anthropic.com (ids only). `credential` omitted means the credential a new session would
        use: the only inference credential, or the operator fallback when the subject has none.

        The control plane asks only an allow-listed host: api.anthropic.com, the deployment default
        endpoint's host, or a host in SH_MODEL_CATALOG_HOSTS. Any other host is not contacted and
        answers 503 `model_catalog_unavailable`, as an unreachable endpoint does; every catalog
        failure carries the same message. Lists only concrete models: a LiteLLM wildcard route
        (e.g. `anthropic/*`) is not listed, though `model` on createSession / updateSession accepts
        an id it matches.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: credential, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: the catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`credential_not_found`: no credential with that name'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: |
            `model_catalog_unavailable`: the endpoint could not list its models (unreachable,
            refused, an unreadable body, or a host outside the catalog allow-list)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create an owned session and mint its first session token
      description: |
        Resolves the inference credential AT CREATION and records the choice: a missing key must fail
        here, not three turns in (spec §6.4). Returns `credential_required` when the subject has none
        and `credential_ambiguous` when it has several and named none -- never a silent pick.

        `sandbox.tier` must be one of the tiers `/v1/discovery` advertises; omitted, the deployment
        default is recorded. A 400 `invalid_request` names the declared tiers. `sandbox`, when
        present, must be an object; any tier is a 400 on a deployment that declares none.

        `model`, when given, is checked against the credential's catalog (GET /v1/models):
        - listed → recorded with its limits, `modelVerified: true`;
        - not listed, but a LiteLLM wildcard route (e.g. `anthropic/*`) matches it as a whole string
          → recorded without limits, `modelVerified: true`;
        - the catalog cannot be read, or the endpoint's host is not in the catalog allow-list (see
          listModels) → recorded without limits, `modelVerified: false`;
        - otherwise → 400 `model_unavailable`.
      security: [{ sessionToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                credentials:
                  type: object
                  properties:
                    inference: { type: string }
                configRef: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                sandbox:
                  type: object
                  properties:
                    tier: { type: string }
                    template:
                      type: string
                      description: |
                        a template id from GET /v1/discovery's sandboxTemplates; 400 when unknown, or
                        on a deployment that declares none. Omitted: none, and the session runs only
                        on untemplated workers. With a template store (SH_PROVENANCE_DIR) the template
                        resolves through the catalog as a sandbox's does (combined control plane spec
                        §3.4): `id`, `id:tag` or `id@sha256:…`, a registered build the caller may see
                        (`400 unknown_template` otherwise), recorded as the session's sandboxBuildId;
                        and, with host agents, activation on first use (`409 template_not_active`)
                    activate:
                      type: boolean
                      default: true
                      description: false to be refused on a template not active without starting its activation (§6.4)
                model:
                  type: string
                  pattern: '^[\x21-\x7e]{1,256}$'
                  description: |
                    a model id the credential's endpoint lists (GET /v1/models), or one its
                    wildcard routes match
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, token, expiresAt]
                properties:
                  sessionId: { type: string }
                  token: { type: string }
                  expiresAt: { type: integer, description: epoch seconds }
                  model: { type: string }
                  modelVerified:
                    type: boolean
                    description: false when the catalog could not be read and the id was accepted unchecked
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            `template_not_active` (Retry-After): the session's template is not active yet, its
            activation started unless `sandbox.activate` is false; `no_active_slot` (Retry-After),
            `template_unavailable`: as activate (template lifecycle spec §6.4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            `config_bundle_not_found`: `configRef` names a digest that is not stored (never
            uploaded, or expired). Promote the directory first. Adopting a stored bundle refreshes
            its 30-day TTL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listSessions
      summary: My sessions, newest first
      description: |
        Paged from the owner zset -- the only user-facing list path. `?owner=` requires the admin role
        and returns 403 otherwise.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - {
            name: cursor,
            in: query,
            schema: { type: integer },
            description: exclusive createdAt of the last item seen,
          }
        - { name: owner, in: query, schema: { type: string }, description: admin only }
      responses:
        '200':
          description: a page of sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions, nextCursor]
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
                  nextCursor: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: forbidden — ?owner= without the admin role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}:
    get:
      operationId: getSession
      summary: One of my sessions
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sessionId' }]
      responses:
        '200':
          description: the session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSession
      summary: Cascade-delete one of my sessions
      description: |
        Tombstone, then data, then index -- never the reverse, since dropping the index first leaves
        data present but invisible (spec §7.3).
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sessionId' }]
      responses:
        '202': { description: accepted — a turn was in flight; the tombstone is set }
        '204': { description: deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSession
      summary: Switch the session's model
      description: |
        `model` is a model id, checked against the session's credential's catalog exactly as on
        createSession, or null for the deployment default:
        - listed → stored with its limits, `modelVerified: true`;
        - not listed, but a LiteLLM wildcard route (e.g. `anthropic/*`) matches it as a whole string
          → stored without limits, `modelVerified: true`;
        - the catalog cannot be read, or the endpoint's host is not in the catalog allow-list (see
          listModels) → stored without limits, `modelVerified: false`;
        - otherwise → 400 `model_unavailable`.
        A turn already running keeps its model; the next turn uses the new one. Any other field is
        `invalid_request`. A session deleted while the catalog answered is `session_not_found`, and
        nothing is written. Audited as `model_changed`.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              additionalProperties: false
              properties:
                model: { type: [string, 'null'], pattern: '^[\x21-\x7e]{1,256}$' }
      responses:
        '200':
          description: the session, switched
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Session' }
                  - type: object
                    properties:
                      modelVerified:
                        type: boolean
                        description: |
                          false when the catalog could not be read (or its host is not
                          allow-listed) and the id was accepted unchecked; true for null
                          (the deployment default)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/resources:
    get:
      operationId: getSessionResources
      summary: Where this session is running
      description: |
        Partly self-reported by the harness, which is the untrusted brain tier, so this projection is
        DISPLAY ONLY and is never consulted for authorization (spec §7.4). A Kubernetes outage yields
        `sandbox.phase: "unknown"` rather than an error.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sessionId' }]
      responses:
        '200':
          description: the projection
          content:
            application/json:
              schema:
                type: object
                required: [session, harness, sandbox]
                properties:
                  session:
                    type: object
                    required: [id, state, createdAt, lastTurnAt, turns, sandboxTier]
                    properties:
                      id: { type: string }
                      state: { type: string, enum: [active, deleting] }
                      createdAt: { type: integer, description: epoch ms }
                      lastTurnAt: { type: [integer, 'null'], description: epoch ms }
                      turns: { type: integer }
                      sandboxTier:
                        type: [string, 'null']
                        description: |
                          the sandbox tier the session runs in (P6.3), by the same rule as
                          Session.sandboxTier; from the control plane's own record, never from the
                          self-reported runtime hash
                  harness: { type: object }
                  sandbox: { type: object }
                  lease: { type: [object, 'null'] }
                  queue: { type: [object, 'null'] }
                  placement:
                    type: [object, 'null']
                    description: where the last leased turn ran; null until one has
                    required: [sandboxId, tier, workspaceReset]
                    properties:
                      sandboxId: { type: string }
                      tier: { type: [string, 'null'] }
                      workspaceReset:
                        type: [object, 'null']
                        description: when, and from which sandbox, the session last lost its workspace
                        required: [at, from]
                        properties:
                          at: { type: number, description: epoch ms }
                          from: { type: string, description: the sandbox the session left }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/models:
    get:
      operationId: listSessionModels
      summary: The models this session's credential reaches
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sessionId' }]
      responses:
        '200':
          description: the catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: '`model_catalog_unavailable`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/token:
    post:
      operationId: mintSessionToken
      summary: Re-mint a session token
      description: A session outlives a 5-minute token.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sessionId' }]
      responses:
        '200':
          description: a fresh session token
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/credentials:
    get:
      operationId: listCredentials
      summary: My credentials — metadata only
      description: No value is ever returned, and there is no read-back path anywhere in /v1.
      security: [{ sessionToken: [] }]
      responses:
        '200':
          description: descriptors
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: '#/components/schemas/CredentialDescriptor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/credentials/{name}:
    put:
      operationId: putCredential
      summary: Store or rotate a credential — write-only
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/credentialName' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CredentialDescriptor'
                - type: object
                  required: [kind, consumer, destination]
                  properties:
                    secret:
                      type: object
                      additionalProperties: { type: string }
                      description: |
                        Exactly the fields the `kind` declares (bearer -> token, basic ->
                        username+password, api-key -> key, oauth2-token -> accessToken). Encrypted at
                        rest and never returned.
      responses:
        '204': { description: stored }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteCredential
      summary: Delete a credential
      description: 204 whether or not it existed — a 404 would be an existence oracle over names.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/credentialName' }]
      responses:
        '204': { description: deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/config-bundles:
    get:
      operationId: listConfigBundles
      summary: My config bundles, newest first
      description: |
        Read from the caller's own budget index, so it needs no keyspace scan and shows no other
        subject's bundles. Unpaged: the per-subject byte budget bounds how many a caller can hold.

        `bytes` is what the bundle is CHARGED — its stored (gzip) size, floored at 4096 — not the
        size of the tar that was uploaded. `promotedAt` is null for a bundle recorded before the
        server stored one, and a bundle stored without a budget entry (ADR-0030 `/promote`, which
        writes Redis directly) does not appear at all.

        A charge can outlive its stored bundle, since expired charges are reaped lazily on the next
        upload. Such an entry is still listed: it holds budget, and `DELETE` accepts it.
      security: [{ sessionToken: [] }]
      responses:
        '200':
          description: every live bundle charged to the caller
          content:
            application/json:
              schema:
                type: object
                required: [bundles]
                properties:
                  bundles:
                    type: array
                    items:
                      type: object
                      required: [digest, bytes, promotedAt, expiresAt]
                      properties:
                        digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                        bytes:
                          type: integer
                          description: the charged bytes, not the uploaded tar's size
                        promotedAt:
                          type: [integer, 'null']
                          description: epoch ms the bundle was first stored; null for a legacy entry
                        expiresAt: { type: integer, description: epoch ms the charge ages out }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: putConfigBundle
      summary: Upload a client-built config bundle (ADR-0038)
      description: |
        Content-addressed: the server re-hashes the tar and refuses a mismatch. Idempotent; a digest
        that already exists only has its TTL refreshed. The decoded tar may be at most 8 MiB. New
        digests count against a per-subject and a deployment-wide byte budget (429 when full).
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest, tar]
              properties:
                digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                tar: { type: string, contentEncoding: base64 }
      responses:
        '201':
          description: stored, or already present
          content:
            application/json:
              schema:
                type: object
                required: [digest, uploaded]
                properties:
                  digest: { type: string }
                  uploaded: { type: boolean, description: false when it already existed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `bundle_quota_exceeded`: storing this NEW digest would exceed the caller's
            (`SH_BUNDLE_SUBJECT_BYTES`) or the deployment's (`SH_BUNDLE_TOTAL_BYTES`) byte budget.
            A digest that is already stored is always accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/config-bundles/{digest}:
    delete:
      operationId: deleteConfigBundle
      summary: Delete a stored config bundle and free its budget (ADR-0038)
      description: |
        Allowed to the subject the digest is charged to (its first uploader) or an `admin`. A bundle
        stored without a budget entry (ADR-0030 `/promote`) is admin-only. Sessions created on the
        bundle get `410 config_bundle_not_found` on their next turn, as for an expired one.
      security: [{ sessionToken: [] }]
      parameters:
        - name: digest
          in: path
          required: true
          description: percent-encode the `:`
          schema: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      responses:
        '204': { description: deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`forbidden`: the digest is charged to another subject and the caller is no admin'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`config_bundle_not_found`: no bundle and no budget entry for that digest'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates:
    get:
      operationId: listTemplates
      summary: The templates a sandbox may be created from, with their builds and readiness
      description: |
        Both profiles (template lifecycle spec §4.1): a sandbox client and a session's brain read
        the same templates. On the sandbox profile, enrolled subjects and admins only
        (`403 not_enrolled`, SBX0 §4.2); on the harness profile, any logged-in subject, and a
        deployment that declares no templates lists none. The template lifecycle spec (§3, §4) adds each template's owner, visibility, onboarding
        state, readiness, tags and builds; the first three fields are unchanged, so an older
        client reads the list as before. Templates are the catalog's (imported once from
        SH_SANDBOX_TEMPLATES); a `private` one is listed only to its owner and admins.
      security: [{ sessionToken: [] }]
      responses:
        '200':
          description: the visible templates, without their worker ids
          content:
            application/json:
              schema:
                type: object
                required: [templates, hosts]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
                  hosts:
                    type: array
                    description: |
                      per KVM host, its active limit and use, as its host agent reports them
                      (template lifecycle spec §6.2). Empty until a host agent reports: that means
                      no host has reported, never that there is no limit. `memory` (1.8.0, register
                      G39) only from an agent that reports it: then placement also needs the
                      memory for each new worker
                    items:
                      type: object
                      required: [id, active, idleLimitSeconds, disk]
                      properties:
                        id: { type: string }
                        active:
                          type: object
                          required: [limit, used]
                          properties:
                            limit: { type: integer }
                            used: { type: integer }
                        idleLimitSeconds: { type: integer }
                        disk:
                          type: object
                          required: [freeGb, floorGb]
                          properties:
                            freeGb: { type: integer }
                            floorGb: { type: integer }
                        memory:
                          type: object
                          description: |
                            memory-aware placement spec §4, all in MiB. `usedMib` is what placement
                            counts: each running worker's guest RAM + 128 (4096 + 128 for a build
                            with no recorded guest size), its VMs' committed memory, and the builds
                            placed here not started yet. `headroomMib` = min(total − floor − used,
                            available − floor − the pending starts), 0 while `brake` is set; a new
                            worker starts here only if its cost fits it
                          required:
                            [
                              totalMib,
                              availableMib,
                              floorMib,
                              usedMib,
                              headroomMib,
                              pressureFull10,
                              pressureLimit,
                              brake,
                              runningWorkers,
                              memfileMismatch,
                              reportedAt,
                            ]
                          properties:
                            totalMib: { type: integer }
                            availableMib: { type: integer }
                            floorMib:
                              type: integer
                              description: |
                                the effective floor the agent applies: SBX_MEM_FLOOR_MIB, else 10%
                                of MemTotal, at least 4096
                            usedMib: { type: integer }
                            headroomMib: { type: integer }
                            pressureFull10:
                              type: [number, 'null']
                              description: memory PSI `full avg10` (a percentage); null with no /proc/pressure
                            pressureLimit: { type: [number, 'null'] }
                            brake:
                              type: [string, 'null']
                              enum: [pressure, stale, null]
                              description: |
                                why the host takes no new start now (what it runs is kept): PSI over
                                its limit, or its last inventory over 60 s old; null otherwise
                            runningWorkers:
                              { type: integer, description: the template workers running there }
                            memfileMismatch:
                              type: array
                              items: { type: string }
                              description: build ids never placed there (their memory file is not the guest's size)
                            reportedAt:
                              { type: integer, description: epoch seconds of its last inventory }
                        idleGraceSeconds:
                          type: integer
                          minimum: 1
                          description: |
                            1.10.0 (register G43), only from an agent that sets one (SBX_IDLE_GRACE_S
                            above 0): how long a released build's worker is kept running there
                        graced:
                          type: integer
                          description: |
                            1.10.0 (register G43), beside idleGraceSeconds: the builds in the host's
                            idle grace now (no lease, worker kept running). Each still holds its
                            whole pinned memory file, counted in `memory.usedMib`, and a slot of
                            `active.limit` until a wanted build needs it
                        start:
                          type: object
                          description: |
                            1.9.0 (cold-start pacing spec §4, register G43), only from an agent that
                            reports its start limit: at most `concurrency` workers start at once
                            there (SBX_START_CONCURRENCY); `seconds` its measured mean cold start,
                            start to attach (null before one is done); `starting` and `queued` its
                            start line now (placed, wanted builds not attached: within the limit,
                            and beyond it), null when the relay's presence cannot be read
                          required: [concurrency, seconds, starting, queued]
                          properties:
                            concurrency: { type: integer, minimum: 1 }
                            seconds: { type: [number, 'null'] }
                            starting: { type: [integer, 'null'] }
                            queued: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
    post:
      operationId: createTemplate
      summary: Create a template (or a new build of your own), self-serve; policy decides
      description: |
        Template lifecycle spec §4, §8.1. Any enrolled client (sandbox profile) or logged-in
        subject (harness profile). Needs SH_PROVENANCE_DIR (else `400 invalid_request`). The create
        is checked against the deployment's policy (GET /v1/policy) before anything is queued: a
        refusal is `422 policy_refused` with `rule`, the gating rule's id (governance
        GATING-RULES.md), and is recorded. Ids are unique per deployment: another subject's id is
        `409 template_exists` (`404 template_not_found` when it is private). Over a quota:
        `429 quota_exceeded` with `quota` (`templates` or `buildsQueued`). The build is queued for
        a host agent (deploy/sbx/host-agent.sh), which builds it and reports it; policy then registers
        or rejects it: follow it at `build`. A create whose inputs match a build of the caller's
        template that is registered or on its way (§3.2) queues nothing and answers that build with
        `reused: true`: `200` when it is registered, `202` while it is not.
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: a registered build of the same inputs, reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateQueued' }
        '202':
          description: queued (or a reused build not yet registered)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateQueued' }
        '400':
          description: '`invalid_request` (also: this deployment stores no templates)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404':
          description: "`template_not_found`: another subject's private template"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `template_exists`; or `self_attested` (G41): a self-attested create asking for
            `deployment` visibility, or adding a self-attested build to a deployment-visible template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`policy_refused`, with `rule`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`quota_exceeded`, with `quota`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}:
    patch:
      operationId: updateTemplate
      summary: Change a template's description or visibility (the owner, or an admin)
      description: |
        Template lifecycle spec §5.1. `private` hides it from other subjects (they get 404, as for an
        id that does not exist) and refuses their new use; their sandboxes and sessions already made
        keep running. Each field that changes writes a `visibility` record (`field`, the new value
        and the one before); a field already at its value changes nothing.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                visibility: { type: string, enum: [private, deployment] }
                description: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: changed (or already so)
          content:
            application/json:
              schema:
                type: object
                required: [templateId, subject, visibility, description, changes]
                properties:
                  templateId: { type: string }
                  subject: { type: string }
                  visibility: { type: string, enum: [private, deployment] }
                  description: { type: string }
                  changes:
                    type: array
                    items:
                      type: object
                      required: [field, value, before, record]
                      properties:
                        field: { type: string, enum: [visibility, description] }
                        value: { type: string }
                        before: { type: string }
                        record: { type: string }
        '400':
          description: '`invalid_request`: no field, or a bad value'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "`not_enrolled`, or `forbidden`: neither the template's owner nor an admin"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `self_attested` (G41): `visibility: deployment` for a template with a self-attested build,
            until an admin adds its gate record's sha256 to trustedGateRecords
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: getTemplate
      summary: One template, its builds with their specs (the seed included)
      description: |
        Both profiles (§4.1). `404 template_not_found` for an unknown id and for a `private`
        template the caller does not own: the existence check (template lifecycle spec §3.2).
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the template; each build carries its `spec`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/builds:
    get:
      operationId: listTemplateBuilds
      summary: A template's builds, newest first, each with its spec
      description: Both profiles (§4.1). `404 template_not_found` as for GET /v1/templates/{id}.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the builds
          content:
            application/json:
              schema:
                type: object
                required: [builds]
                properties:
                  builds:
                    type: array
                    items: { $ref: '#/components/schemas/TemplateBuild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createTemplateBuild
      summary: A new build of your own template (a new image or spec); as POST /v1/templates
      description: |
        The template must exist (`404 template_not_found`) and be the caller's
        (`409 template_exists`); otherwise exactly POST /v1/templates, the body's `id` ignored,
        build reuse included.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: a registered build of the same inputs, reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateQueued' }
        '202':
          description: queued (or a reused build not yet registered)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateQueued' }
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`template_exists`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`policy_refused`, with `rule`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`quota_exceeded`, with `quota`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/tags:
    post:
      operationId: moveTemplateTags
      summary: Move tags onto a registered build (the owner, or an admin)
      description: |
        Template lifecycle spec §3.2, §5.1: tags are labels on builds, moved without rebuilding.
        After the move, `id:tag` (and the bare `id`, for `default`) resolves to the new build for
        new sandboxes and sessions; those already created keep their build. Each tag that changes
        writes a `tag` record (the new build and the one before); a tag already on the build
        changes nothing (`record: null`). Retired build: `410 template_retired`; one not
        registered: `400 invalid_request`.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags, build]
              properties:
                tags:
                  type: array
                  minItems: 1
                  maxItems: 16
                  uniqueItems: true
                  items: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,30}$' }
                build: { type: string, description: a build id or handle of this template }
      responses:
        '200':
          description: moved
          content:
            application/json:
              schema:
                type: object
                required: [templateId, subject, buildId, tags]
                properties:
                  templateId: { type: string }
                  subject: { type: string }
                  buildId: { type: string }
                  tags:
                    type: array
                    items:
                      type: object
                      required: [tag, buildId, before, record]
                      properties:
                        tag: { type: string }
                        buildId: { type: string }
                        before:
                          {
                            type: [string, 'null'],
                            description: 'the build it named until now; null if new',
                          }
                        record:
                          {
                            type: [string, 'null'],
                            description: 'the tag record written; null if unchanged',
                          }
        '400':
          description: '`invalid_request`: bad tags, or a build that is not registered'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "`not_enrolled`, or `forbidden`: neither the template's owner nor an admin"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`template_not_found`: no such template, or no such build of it'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: '`template_retired`: the build is retired'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listTemplateTags
      summary: A template's tags, each with the build it names and when and by whom it was set
      description: Both profiles (§4.1). `404 template_not_found` as for GET /v1/templates/{id}.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the tags, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      required: [tag, buildId, assignedAt, assignedBy]
                      properties:
                        tag: { type: string }
                        buildId: { type: string }
                        assignedAt: { type: integer, description: epoch seconds }
                        assignedBy:
                          type: [string, 'null']
                          description: a subject; null when the deployment set it
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/tags/{tag}:
    delete:
      operationId: removeTemplateTag
      summary: Remove a tag (the owner, or an admin); its build stays
      description: |
        Template lifecycle spec §5.1. The tag goes; the build it named is not deleted and stays
        addressable by its build id. `default` is moved, never removed (`400 invalid_request`): the
        bare `id` must resolve. A `tag` record (`buildId: null`, the one before) names the caller.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: tag, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                type: object
                required: [templateId, subject, tag, buildId, before, record]
                properties:
                  templateId: { type: string }
                  subject: { type: string }
                  tag: { type: string }
                  buildId: { type: 'null' }
                  before: { type: string }
                  record: { type: string }
        '400':
          description: '`invalid_request`: the default tag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "`not_enrolled`, or `forbidden`: neither the template's owner nor an admin"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`template_not_found`: no such template, or no such tag on it'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/builds/{build}:
    delete:
      operationId: retireTemplateBuild
      summary: Retire one build (the owner, or an admin)
      description: |
        As `POST /v1/templates/{id}/retire`, for one build named by its build id or handle; the
        template's other builds stay. A tag pointing at it still resolves to it, and a create through
        that tag is refused `410 template_retired`: move the tag first.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: build, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: retired
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RetiredBuild'
                  - type: object
                    required: [templateId, subject, status]
                    properties:
                      templateId: { type: string }
                      subject: { type: string }
                      status: { type: string, enum: [retired] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "`not_enrolled`, or `forbidden`: neither the template's owner nor an admin"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`template_not_found`: no such template, or no such build of it'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`build_in_use`: a live sandbox runs on the build, or an active session is pinned to it'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: getTemplateBuild
      summary: One build of a template, with its spec, by build id or by the create's handle
      description: |
        Both profiles (§4.1). The build id is `sha256:<manifest hash>`, or `imported:<12 hex>` for
        a template imported from SH_SANDBOX_TEMPLATES (no snapshot named); URL-encode it.
        `404 template_not_found` for an unknown template or build.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: build, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the build
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateBuild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/retire:
    post:
      operationId: retireTemplate
      summary: Retire a template, every build of it (the owner, or an admin)
      description: |
        Template lifecycle spec §5.1. Every build not yet retired becomes `retired` (readiness
        `retired`), its leases go, so it is no longer wanted, and a host holding it is asked to remove
        it (`GET /v1/hosts/{host}/wanted` `remove`). A sandbox or session naming the template, or a
        pinned build of it, is then refused `410 template_retired`. Each build retired writes a
        `retire` record naming the caller; its earlier records stay. Idempotent: an already retired
        build is listed with `record: null` (no second record). Refused `409 build_in_use` while a
        live sandbox runs on any of its builds, or an active session is pinned to one: delete it,
        then retire. A retire never cuts off running work. It cannot be undone: a new build of the
        template (`POST /v1/templates/{id}/builds`) is the way back.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1024, description: kept in the retire record }
      responses:
        '200':
          description: retired
          content:
            application/json:
              schema:
                type: object
                required: [templateId, subject, builds, status]
                properties:
                  templateId: { type: string }
                  subject: { type: string, description: who retired it }
                  status: { type: string, enum: [retired] }
                  builds:
                    type: array
                    items: { $ref: '#/components/schemas/RetiredBuild' }
        '400':
          description: '`invalid_request`: a reason that is not a string of at most 1024 characters'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "`not_enrolled`, or `forbidden`: neither the template's owner nor an admin"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`build_in_use`: a live sandbox runs on one of its builds, or an active session is pinned to one'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/builds/{build}/reject:
    post:
      operationId: rejectTemplateBuild
      summary: Reject a registered build after the fact (an admin)
      description: |
        Template lifecycle spec §5.2: an admin rejects a registered build when a rule is found
        broken, with the reason. The build becomes `rejected` (`reason.rule` `admin`), its leases go,
        a host holding it removes it (`GET /v1/hosts/{host}/wanted` `remove`), and a create naming it
        answers `400 unknown_template`, as for a build policy rejected at registration. A `reject`
        record names the admin and the reason. Refused `409 build_in_use` under a live sandbox or an
        active session pinned to it. Not reversible: a new build is the way back.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: build, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 1024,
                    description: the rule found broken,
                    and why,
                  }
      responses:
        '200':
          description: rejected
          content:
            application/json:
              schema:
                type: object
                required: [templateId, subject, build, buildId, record, status]
                properties:
                  templateId: { type: string }
                  subject: { type: string, description: the admin }
                  build: { type: string }
                  buildId: { type: [string, 'null'] }
                  record:
                    {
                      type: [string, 'null'],
                      description: 'the reject record written; null if already rejected',
                    }
                  status: { type: string, enum: [rejected] }
        '400':
          description: '`invalid_request`: no reason, or a build that is not registered'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: not an admin, or (a change) not an admin named in the settings'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`build_in_use`: a live sandbox runs on the build, or an active session is pinned to it'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/owner:
    put:
      operationId: transferTemplateOwner
      summary: Transfer a template to another enrolled subject (an admin)
      description: |
        Template lifecycle spec §5.2. The new owner gets every owner action and its quota counts the
        template from now on; leases, sandboxes and sessions already made keep their subjects. An
        `owner` record names the admin, the new owner and the one before; a transfer to the current
        owner changes nothing (`record: null`). The new owner must be enrolled (the allow list). A
        template the deployment declared (imported from SH_SANDBOX_TEMPLATES, no owner) is handed
        to a subject the same way, `before: null` (register G34); its id then belongs to that
        subject, who can build, tag and retire it. A restart does not re-import it.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner]
              properties:
                owner: { type: string, pattern: '^github:[0-9]+$' }
      responses:
        '200':
          description: transferred (or already theirs)
          content:
            application/json:
              schema:
                type: object
                required: [templateId, subject, owner, before, record]
                properties:
                  templateId: { type: string }
                  subject: { type: string, description: the admin }
                  owner: { type: string }
                  before: { type: [string, 'null'] }
                  record: { type: [string, 'null'] }
        '400':
          description: '`invalid_request`: a malformed or unenrolled subject, or a declared template'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: not an admin, or (a change) not an admin named in the settings'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/builds/{build}/cancel:
    post:
      operationId: cancelTemplateBuild
      summary: Withdraw a build not yet built (the owner)
      description: |
        Template lifecycle spec §5.1 (register G22). The template's owner, or an admin, cancels a
        `queued`, `building` or `probing` build: it becomes `failed` with `reason.step` `cancelled`,
        and a `build` record (outcome `cancelled`) names who did it. A host agent still building it
        has its later reports refused, so it never registers. Another subject: `403 forbidden`; an
        unknown build: `404 template_not_found`; any other status: `400 invalid_request`.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: build, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: cancelled
          content:
            application/json:
              schema:
                type: object
                required: [templateId, build, status]
                properties:
                  templateId: { type: string }
                  build: { type: string, description: the build's handle }
                  status: { type: string, enum: [failed] }
        '400':
          description: '`invalid_request`: the build is not queued, building or probing'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "`not_enrolled`, or `forbidden`: not the template's owner"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/policy:
    get:
      operationId: getPolicy
      summary: The deployment's template policy (profiles, envelope, registries, trusted gate records, quotas)
      description: |
        Template lifecycle spec §8. Its `record` is the provenance `policy` record every `check`
        cites; `digest` is the sha256 of the policy itself. Needs SH_PROVENANCE_DIR.
      security: [{ sessionToken: [] }]
      responses:
        '200':
          description: the policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        '400':
          description: '`invalid_request`: this deployment stores no templates'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
    put:
      operationId: putPolicy
      summary: Set the template policy (admin); recorded
      description: |
        The policy is stored as sent. When it removes a gate record's sha256 from trustedGateRecords
        (register G41 (c), the user's decision Q4 (i)), the builds that become self-attested on a
        deployment-visible template make that template private on read; they are named as
        `narrowed` in the answer and in the `policy` record, so the narrowing is never silent.
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Policy' }
      responses:
        '200':
          description: the policy as set, and `narrowed` when a trust removal narrowed templates
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PolicyView' }
                  - type: object
                    properties:
                      narrowed:
                        type: array
                        items:
                          type: object
                          required: [template, buildId]
                          properties:
                            template: { type: string }
                            buildId: { type: string }
        '400':
          description: '`invalid_request`: the policy is malformed (each problem named)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`forbidden` (not an admin) or `not_enrolled`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/quota:
    get:
      operationId: getQuota
      summary: The caller's template quotas and use (§6.2), and the live-sandbox cap
      description: |
        `active.used` counts the builds the caller holds a live lease on (§6.3). On the sandbox
        profile, `sandboxes` is SBX0's per-subject cap on live sandboxes (`SH_SANDBOX_MAX_PER_SUBJECT`)
        and the caller's live ones (register G27); absent elsewhere. Needs SH_PROVENANCE_DIR.
      security: [{ sessionToken: [] }]
      responses:
        '200':
          description: limits and use
          content:
            application/json:
              schema:
                type: object
                required: [subject, templates, buildsQueued, active]
                properties:
                  subject: { type: string }
                  templates: { $ref: '#/components/schemas/LimitUse' }
                  buildsQueued: { $ref: '#/components/schemas/LimitUse' }
                  active: { $ref: '#/components/schemas/LimitUse' }
                  sandboxes: { $ref: '#/components/schemas/LimitUse' }
                  quotaSource:
                    type: string
                    enum: [subject, default]
                    description: an admin-set quota for this subject, or the deployment default
        '400':
          description: '`invalid_request`: this deployment stores no templates'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
  /v1/quota/{subject}:
    put:
      operationId: putQuota
      summary: Set the deployment's default quota, or one subject's (an admin)
      description: |
        Template lifecycle spec §5.2. `subject` is `default` (the deployment default) or a subject
        (`github:<id>`, an override); a body of `null` removes a subject's override, returning it to
        the default. Each change is a policy change: a new `policy` record (the whole policy), whose
        digest is answered, so the chain shows who set which quota when. Enforced at once.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Quota'
                - type: 'null'
      responses:
        '200':
          description: set
          content:
            application/json:
              schema:
                type: object
                required: [target, subject, quota, before, policy, record]
                properties:
                  target:
                    { type: string, description: '`default` or the subject whose quota changed' }
                  subject: { type: string, description: the admin }
                  quota: { oneOf: [{ $ref: '#/components/schemas/Quota' }, { type: 'null' }] }
                  before: { description: the quota before (null for no override) }
                  policy: { type: string, description: the new policy's digest }
                  record: { type: string, description: the policy record written }
        '400':
          description: '`invalid_request`: a bad target or quota, or no template store'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: not an admin, or (a change) not an admin named in the settings'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/subjects:
    get:
      operationId: listSubjects
      summary: Every enrolled subject, with its roles and where each comes from (an admin)
      description: |
        Enrollment and roles spec §4 (register G38). A subject is enrolled by the deployment's
        settings (`source: env`: SH_ALLOWED_SUBJECTS, SH_ADMIN_SUBJECTS) or through this API
        (`source: api`). Roles are evaluated per request: an API grant past its `until` is not listed.
      security: [{ sessionToken: [] }]
      responses:
        '200':
          description: the subjects
          content:
            application/json:
              schema:
                type: object
                required: [subjects]
                properties:
                  subjects: { type: array, items: { $ref: '#/components/schemas/Subject' } }
        '400':
          description: '`invalid_request`: a malformed subject or body, or no members store (SH_PROVENANCE_DIR unset)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: not an admin, or (a change) not an admin named in the settings'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/subjects/{subject}:
    put:
      operationId: enrollSubject
      summary: Enroll a subject (an admin)
      description: |
        Body `{"enrolled": true}`. Writes a `member` record on the `members` provenance stream, naming
        the admin. Enrolled at the subject's next request. Enrolling one already enrolled writes nothing.
      security: [{ sessionToken: [] }]
      parameters:
        - name: subject
          in: path
          required: true
          schema: { type: string, pattern: '^github:[0-9]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolled]
              properties: { enrolled: { type: boolean, enum: [true] } }
      responses:
        '200':
          description: enrolled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Subject'
                  - type: object
                    required: [record]
                    properties:
                      record:
                        type: [string, 'null']
                        description: the `member` or `role` record written (null when nothing changed)
        '400':
          description: '`invalid_request`: a malformed subject or body, or no members store (SH_PROVENANCE_DIR unset)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: not an admin, or (a change) not an admin named in the settings'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: unenrollSubject
      summary: Unenroll a subject enrolled through the API (an admin)
      description: |
        Writes a `member` record. The subject is refused at its next request (`403 not_enrolled`); its
        live sandboxes run to their expiry and its templates keep their owner. A subject enrolled by
        the settings can't be unenrolled here: `409 bootstrap_subject`.
      security: [{ sessionToken: [] }]
      parameters:
        - name: subject
          in: path
          required: true
          schema: { type: string, pattern: '^github:[0-9]+$' }
      responses:
        '200':
          description: unenrolled (or it was not)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Subject'
                  - type: object
                    required: [record]
                    properties:
                      record:
                        type: [string, 'null']
                        description: the `member` or `role` record written (null when nothing changed)
        '400':
          description: '`invalid_request`: a malformed subject or body, or no members store (SH_PROVENANCE_DIR unset)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: not an admin, or (a change) not an admin named in the settings'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`bootstrap_subject`: enrolled by SH_ALLOWED_SUBJECTS or SH_ADMIN_SUBJECTS'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/subjects/{subject}/roles/admin:
    put:
      operationId: grantAdmin
      summary: Grant the admin role, optionally until a time (an admin)
      description: |
        Only an admin named in the settings (SH_ADMIN_SUBJECTS) may grant it (spec §6, decision 1);
        an API-granted admin is refused `403 forbidden`. An optional `until`
        (epoch seconds, in the future) makes it lapse by itself (decision 4); the first request that
        sees it lapsed writes a `role` record `expired`, once. A grant writes a `role` record
        `granted`, naming the admin and `until`. Effective at the subject's next request.
      security: [{ sessionToken: [] }]
      parameters:
        - name: subject
          in: path
          required: true
          schema: { type: string, pattern: '^github:[0-9]+$' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  {
                    type: [integer, 'null'],
                    description: 'epoch seconds; absent or null: no expiry',
                  }
      responses:
        '200':
          description: granted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Subject'
                  - type: object
                    required: [record]
                    properties:
                      record:
                        type: [string, 'null']
                        description: the `member` or `role` record written (null when nothing changed)
        '400':
          description: '`invalid_request`: a malformed subject or body, or no members store (SH_PROVENANCE_DIR unset)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: not an admin, or (a change) not an admin named in the settings'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`bootstrap_subject`: an admin by SH_ADMIN_SUBJECTS'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: revokeAdmin
      summary: Revoke an API-granted admin role (an admin)
      description: |
        Writes a `role` record `revoked`. Refused for an admin by the settings (`409
        bootstrap_subject`) and for the caller's own role (`409 self_revoke`), so the API can't
        lock itself out.
      security: [{ sessionToken: [] }]
      parameters:
        - name: subject
          in: path
          required: true
          schema: { type: string, pattern: '^github:[0-9]+$' }
      responses:
        '200':
          description: revoked (or it held none)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Subject'
                  - type: object
                    required: [record]
                    properties:
                      record:
                        type: [string, 'null']
                        description: the `member` or `role` record written (null when nothing changed)
        '400':
          description: '`invalid_request`: a malformed subject or body, or no members store (SH_PROVENANCE_DIR unset)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: not an admin, or (a change) not an admin named in the settings'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`bootstrap_subject` (an admin by SH_ADMIN_SUBJECTS), or `self_revoke`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/hosts/{host}/inventory:
    post:
      operationId: hostInventory
      summary: A host agent reports what it holds (by manifest hash) and its limits
      description: |
        Template lifecycle spec §6.1. The host's own bearer, SH_HOST_TOKEN_<ID> (SH_TEMPLATE_HOSTS);
        the host in the path must be the one whose token is presented. Body
        `{holds: [{template, manifestHash}], limits: {activeLimit, idleLimitSeconds,
        buildConcurrency, diskFreeGb, diskFloorGb}, memory?}`.

        `memory` (1.8.0, register G39) is optional: an agent before it sends none, and its host is
        placed by `activeLimit` alone, as before; a control plane before it ignores it. Each field
        is optional and a malformed one is dropped. `memTotalMib`, `memAvailableMib` and
        `memFloorMib` are used only all three together.

        `limits.startConcurrency` and `limits.startSeconds` (1.9.0, register G43) are optional: the
        agent's start limit (SBX_START_CONCURRENCY, a whole number from 1) and the mean of its last
        cold starts, start to attach, in seconds (absent before one is done; used only beside
        startConcurrency). Without startConcurrency (an older agent) its builds have no place in a
        start line, and Retry-After is as before.

        `limits.idleGraceSeconds` (1.10.0, register G43) is optional: SBX_IDLE_GRACE_S, a whole
        number of seconds, 0 (off) to 86400. Absent (an older agent), malformed or 0: no grace, as
        before.
      security: [{ hostToken: [] }]
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limits:
                  type: object
                  properties:
                    activeLimit: { type: integer }
                    idleLimitSeconds: { type: integer }
                    buildConcurrency: { type: integer }
                    diskFreeGb: { type: integer }
                    diskFloorGb: { type: integer }
                    startConcurrency:
                      type: integer
                      minimum: 1
                      description: SBX_START_CONCURRENCY (default 4), at most this many workers starting at once (1.9.0)
                    startSeconds:
                      type: number
                      description: the mean of the last (up to 10) cold starts, start to attach, seconds (1.9.0)
                    idleGraceSeconds:
                      type: integer
                      minimum: 0
                      maximum: 86400
                      description: SBX_IDLE_GRACE_S (default 0, off), how long a released build's worker is kept running (1.10.0)
                memory:
                  type: object
                  description: what the host agent reads of its memory (memory-aware placement spec §4)
                  properties:
                    memTotalMib: { type: integer, description: /proc/meminfo MemTotal, MiB }
                    memAvailableMib: { type: integer, description: /proc/meminfo MemAvailable, MiB }
                    memFloorMib:
                      type: integer
                      description: the effective floor (SBX_MEM_FLOOR_MIB, else 10% of MemTotal, at least 4096)
                    memPressureFull10:
                      type: number
                      description: |
                        /proc/pressure/memory `full avg10`, a percentage; absent with no
                        /proc/pressure (no brake)
                    memPressureLimit:
                      type: number
                      description: SBX_MEM_PRESSURE_LIMIT (default 10); above it, no new start on this host
                    runningWorkers:
                      type: array
                      items: { type: string }
                      description: the workers of held builds whose sbx-worker unit is active
                    vmCommittedMib:
                      type: object
                      additionalProperties: { type: integer }
                      description: |
                        worker id -> its VMs' unreclaimable memory, MiB: its slice's memory.stat
                        anon + shmem + kernel, never page cache (register G48); a worker whose slice
                        could not be read is absent
                    memfileMismatch:
                      type: array
                      items: { type: string }
                      description: |
                        manifest hashes of held builds whose memory file is not guest_ram_mb x 1 MiB:
                        never placed on this host
      responses:
        '200':
          description: recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { type: string }
                  holds: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/hosts/{host}/builds/claim:
    post:
      operationId: hostClaimBuilds
      summary: A host agent claims up to `max` (at most 4) queued builds, oldest first, subjects in turn
      description: |
        Each claimed build moves to `building`, held by this host. Each comes with its template
        id, handle, image, the spec as template-build.sh reads it, and where to fetch its gate
        record (`/v1/hosts/{host}/blobs/{sha256}`).
      security: [{ hostToken: [] }]
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { max: { type: integer } } }
      responses:
        '200':
          description: the claimed builds (possibly none)
          content:
            application/json:
              schema:
                type: object
                required: [builds]
                properties:
                  builds:
                    type: array
                    items:
                      type: object
                      required: [template, build, image, spec]
                      properties:
                        template: { type: string }
                        build: { type: string }
                        image: { type: string }
                        spec: { type: object }
                        gateRecord: { type: string }
        '400':
          description: '`invalid_request`: this deployment stores no templates'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/hosts/{host}/blobs/{digest}:
    get:
      operationId: hostBlob
      summary: A document the store holds by sha256 (a gate record), for a host agent
      security: [{ hostToken: [] }]
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: digest, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the document, base64 of its exact bytes
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha256: { type: string }
                  base64: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/hosts/{host}/builds/{build}/log:
    post:
      operationId: hostBuildLog
      summary: A host agent appends log entries to a build it claimed (at most 200 a call)
      security: [{ hostToken: [] }]
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: build, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      level: { type: string, enum: [info, warn, error] }
                      step: { type: string }
                      message: { type: string }
      responses:
        '200':
          description: appended
          content:
            application/json:
              schema: { type: object, properties: { appended: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`not_found`: no such build claimed by this host'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/hosts/{host}/builds/{build}/report:
    post:
      operationId: hostBuildReport
      summary: A host agent reports a step of a build it claimed; `built` registers or rejects it
      description: |
        `{event: building | probing}`; `{event: failed, step, message}`; or `{event: built,
        templateRecord, manifest}`, each the host's file (T, S) as a string. On `built` the
        control plane stores both byte for byte, writes a `build` record, checks them against the
        create's request (§8.2: image, R's digest, manifest hash and version 2, size, gate
        record, X12) and registers the build (its id becomes the manifest hash; the template's
        first takes `default`) or rejects it naming the rule, writing a `check` record either way.
      security: [{ hostToken: [] }]
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: build, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: the build's new status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
                  buildId: { type: string }
                  rule: { type: string }
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`not_found`: no such build claimed by this host'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/activate:
    post:
      operationId: activateTemplate
      summary: Take or renew your lease on a registered build (§6.3); the host agent starts its worker
      description: |
        Body `{tag?, build?, leaseSeconds?}`: the build by tag (default `default`) or build id; the
        lease 60-86400 s (default the hosts' idleLimit, else 3600), renewed by calling again,
        without limit. A leased build is never evicted. `409 template_unavailable` (no registered
        build, or no host holds it; `reason: memfile_mismatch` when every holder reports its memory
        file wrong), `409 no_active_slot` with `Retry-After` (every holder at its limit with leased
        builds; `reason: memory` when a holder under its limit has no memory headroom for the
        worker, register G39), `429 quota_exceeded` with `quota: active`.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tag: { type: string }
                build: { type: string }
                leaseSeconds: { type: integer }
      responses:
        '200':
          description: leased
          content:
            application/json:
              schema:
                type: object
                required: [templateId, buildId, leaseUntil, host]
                properties:
                  templateId: { type: string }
                  buildId: { type: string }
                  leaseUntil: { type: integer, description: epoch seconds }
                  host:
                    {
                      type: [string, 'null'],
                      description: where it is placed; null if no agent reports,
                    }
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`template_unavailable` or `no_active_slot` (with Retry-After), with `readiness`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`quota_exceeded`, with `quota: active`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/deactivate:
    post:
      operationId: deactivateTemplate
      summary: 'Release your lease (an admin with `all: true`, every lease); the build drains if none is left'
      description: |
        With no lease left, the build is no longer wanted. On a host with an idle grace
        (SBX_IDLE_GRACE_S, 1.10.0, register G43) its running worker is kept for that long after the
        release, so a use soon after is warm. `stopNow: true` skips the grace: once no lease is left
        (after this release), the worker is stopped at the host's next poll, as on a host with no
        grace; a build already in its grace has it ended (`released: 0`). The `deactivate` record
        carries `stopNow: true`. A stopNow while others hold leases changes nothing for them.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                all: { type: boolean }
                stopNow:
                  type: boolean
                  description: 1.10.0 (register G43), skip the host's idle grace (force a cold start next time); not a boolean is `400 invalid_request`
      responses:
        '200':
          description: released
          content:
            application/json:
              schema:
                type: object
                required: [templateId, released]
                properties:
                  templateId: { type: string }
                  released: { type: integer }
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404':
          description: '`template_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/hosts/{host}/wanted:
    get:
      operationId: hostWanted
      summary: The workers a host agent should run (placed on it), stop (no lease, no live sandbox) and remove (retired)
      description: |
        `run` is in the wanted order, first leased first (1.9.0: the order the agent starts them in,
        at most its start limit at once). On a host with an idle grace (1.10.0, register G43) the
        graced builds follow the wanted ones in `run`, soonest grace end first, and are listed in
        `graced`; a retired or rejected build is listed in `stop` as well as `remove`, so its worker
        is stopped and removed in one poll, never held for a grace. A graced worker displaced for a
        wanted build is re-checked for a lease when the answer is made: a build leased since stays
        in `run`.
      security: [{ hostToken: [] }]
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: wanted state
          content:
            application/json:
              schema:
                type: object
                required: [run, stop]
                properties:
                  run: { type: array, items: { $ref: '#/components/schemas/WantedWorker' } }
                  stop: { type: array, items: { $ref: '#/components/schemas/WantedWorker' } }
                  remove:
                    type: array
                    description: |
                      Retired builds this host holds, with no live sandbox on their worker (template
                      lifecycle spec §6.1 step 7): uninstall the worker, delete the snapshot, report
                      `removed`. Absent from a control plane before retire.
                    items: { $ref: '#/components/schemas/WantedWorker' }
                  egressSids:
                    type: array
                    items: { type: string }
                    description: |
                      The workspace keys of the sandboxes whose egress events this host ships (register
                      G42): every sandbox on a worker of a build it holds, live or ended less than 600 s
                      ago, the set `POST /v1/hosts/{host}/egress` accepts. The agent sends only these
                      sandboxes' events (and `audit_dropped` reports), so the proxy's other clients'
                      events never leave the host. Absent from a control plane before 1.7.0: the agent
                      then sends nothing.
                  starting:
                    type: array
                    items: { type: string }
                    description: |
                      1.9.0 (cold-start pacing spec §4, register G43): the build ids of `run` whose
                      worker is not attached to the relay (its presence, which readiness reads), in
                      `run`'s order. The agent counts those whose unit is active as starting, and
                      starts at most SBX_START_CONCURRENCY less those. Absent from a control plane
                      before 1.9.0, or when the presence cannot be read: the agent then counts its own
                      recent starts (SBX_START_WINDOW_S).
                  graced:
                    type: array
                    items: { type: string }
                    description: |
                      1.10.0 (cold-start pacing spec §4, register G43), only for a host whose agent
                      reports an idle grace: the build ids of `run` with no lease, kept running in
                      the grace. The agent never starts one (a grace keeps a running worker) and
                      counts those it runs in its summary. Absent from a control plane before
                      1.10.0, or for a host with no grace.
        '400':
          description: '`invalid_request`: this deployment stores no templates'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/hosts/{host}/workers/report:
    post:
      operationId: hostWorkerReport
      summary: A host agent reports a worker attached, refused or detached (provenance; readiness is the relay's)
      security: [{ hostToken: [] }]
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buildId, event]
              properties:
                buildId: { type: string }
                event:
                  type: string
                  enum: [attached, refused, detached, removed]
                  description: "`removed` (a retired build's worker and snapshot gone) writes a `retire` record"
                reason: { type: string }
      responses:
        '200':
          description: recorded
          content:
            application/json:
              schema: { type: object, properties: { recorded: { type: string } } }
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`not_found`: no registered build this host holds'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/hosts/{host}/egress:
    post:
      operationId: hostEgress
      summary: A host agent posts the egress proxy's audit events from its journal (register G42)
      description: |
        Up to 1000 events, each exactly as `moca-egress` wrote it, and the journal cursor after the
        last. An event is stored in a sandbox's log when its `sid` is the workspace key of a
        sandbox on a worker of a build this host holds, and the sandbox ended at most 600 s ago;
        every other event is refused and counted. One naming such a sandbox that is not exactly a
        proxy Event (an unknown field, a wrong type) is not stored, and counted as dropped there.
        An `audit_dropped` event (no VM) is charged to every sandbox on this host's workers live
        within 60 s before it. A log holds at most 10,000 events, and all logs together at most
        200,000 (about 64 MB of Redis); the rest count as dropped (`cap`, `budget`).
        Idempotent by (host, cursor): a post repeating the host's last cursor appends nothing and
        answers as the first.
      security: [{ hostToken: [] }]
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events, cursor]
              properties:
                events:
                  {
                    type: array,
                    maxItems: 1000,
                    items: { $ref: '#/components/schemas/EgressEvent' },
                  }
                oversized:
                  type: array
                  items: { type: string }
                  description: |
                    the sid of each event the agent kept back for its size (over 8 KiB); each is
                    counted as dropped in its sandbox's log. events and oversized: 1000 in all
                cursor:
                  {
                    type: string,
                    maxLength: 512,
                    description: 'the journal cursor after the last event',
                  }
      responses:
        '200':
          description: appended (or a replay's first answer)
          content:
            application/json:
              schema:
                type: object
                required: [accepted, refused, capped, overBudget, invalid, dropped, cursor]
                properties:
                  accepted: { type: integer }
                  refused:
                    { type: integer, description: "no sandbox of this host's, or its log sealed" }
                  capped: { type: integer, description: "over a log's 10,000" }
                  overBudget:
                    { type: integer, description: 'over the 200,000 of all logs together' }
                  invalid:
                    type: integer
                    description: "named a sandbox of this host's but not a proxy Event, or oversized"
                  dropped:
                    { type: integer, description: "the audit_dropped reports' counts, summed" }
                  cursor: { type: string }
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sandboxes:
    description: |
      Sandbox service control planes only (`SH_ROUTE_PROFILE=sandbox`); a MOCA control plane answers
      404 (SBX0 §4.1).
    post:
      operationId: createSandbox
      summary: Create a sandbox
      description: |
        Enrolled subjects and admins only. Does no I/O to the worker: the first Exec creates the
        workspace, so a new sandbox always starts empty (SBX0 §5.1).

        Activation on first use (template lifecycle spec §6.4), on a deployment with host agents
        (SH_TEMPLATE_HOSTS): a sandbox is created only on an `active` build. On one that is not,
        the create takes the caller's activation lease (as POST /v1/templates/{id}/activate, with
        its refusals: `409 no_active_slot`, `409 template_unavailable`, `429 quota_exceeded`) and
        answers `409 template_not_active` with `readiness` and `Retry-After`; retry after the wait.
        Retry-After (1.9.0, register G43) is the build's place in its host's start line, when the
        host's agent reports its start limit and a measured start time:
        `ceil(ceil(queuePosition / startConcurrency) × startSeconds)`; else 30 s, as before.
        With `activate: false` nothing is started. No sandbox is kept while waiting, so a wait
        never uses the live-sandbox cap. Without host agents the create succeeds as before.
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template:
                  type: string
                  description: a template from GET /v1/templates, as `id`, `id:tag` or `id@sha256:…`
                activate:
                  type: boolean
                  default: true
                  description: false to be refused on a build not active without starting its activation (§6.4)
                name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
                labels:
                  type: object
                  maxProperties: 16
                  propertyNames: { pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
                  additionalProperties: { type: string }
                  description: at most 16 pairs; each value at most 256 UTF-8 bytes
      responses:
        '201':
          description: the new sandbox, ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400':
          description: '`invalid_json`, `invalid_request`, or `unknown_template`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '409':
          description: |
            `name_conflict`: the caller already has a live sandbox with that name;
            `template_not_active` (Retry-After): the build is not active yet, its activation started
            unless `activate: false`; `no_active_slot` (Retry-After), `template_unavailable`: as activate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`quota_exceeded`: per-user or deployment-wide live sandboxes (SBX0 §5.3), or the active-template quota on first use'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listSandboxes
      summary: My sandboxes, newest first
      description: |
        The caller's own, terminated (but retained) ones included. `?all=1` lists everyone's and
        requires the admin role.
      security: [{ sessionToken: [] }]
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [ready, terminated] }
        - name: all
          in: query
          required: false
          description: admins only
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: the sandboxes, newest first
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes]
                properties:
                  sandboxes: { type: array, items: { $ref: '#/components/schemas/Sandbox' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_enrolled`, or `forbidden`: ?all= without the admin role'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sandboxes/{id}:
    get:
      operationId: getSandbox
      summary: One sandbox
      description: The caller's own; admins may read any. Another user's sandbox is a 404.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sandboxId' }]
      responses:
        '200':
          description: the sandbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteSandbox
      summary: Terminate a sandbox
      description: |
        Idempotent: deleting a terminated sandbox answers 200 with how it ended. The caller's own;
        admins may delete any. The host janitor frees the workspace later (SBX0 §8.3).
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sandboxId' }]
      responses:
        '200':
          description: terminated
          content:
            application/json:
              schema:
                type: object
                required: [id, state, reason]
                properties:
                  id: { type: string }
                  state: { type: string, enum: [terminated] }
                  reason: { type: string, enum: [deleted, expired] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sandboxes/{id}/token:
    post:
      operationId: mintSandboxToken
      summary: Mint a sandbox token for Exec
      description: |
        Owner only, admins included: an admin calling it on another user's sandbox gets the same
        404 as anyone else (SBX0 §4.2). The token's `exp` is the sooner of now plus
        SH_SANDBOX_TOKEN_TTL_SECONDS and the sandbox's `expiresAt` (§4.3). No request body.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/sandboxId' }]
      responses:
        '200':
          description: a sandbox token, and where to send Exec with it
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, execEndpoint, wrk, wsk, execCa]
                properties:
                  token: { type: string, description: 'JWT, typ moca-sandbox+jwt' }
                  expiresAt: { type: integer, description: epoch seconds }
                  execEndpoint: { type: string, description: host:port of the exec Route }
                  wrk:
                    type: string
                    description: the worker sandbox_id serving the template (ExecRequest.sandbox_id)
                  wsk: { type: string, description: the workspace key (Exec.workspace_key) }
                  execCa:
                    type: [string, 'null']
                    description: the exec Route's CA (PEM) when self-issued, else null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`sandbox_terminated`, with `reason` (deleted | expired)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sandboxes/{id}/egress:
    get:
      operationId: getSandboxEgress
      summary: A sandbox's egress log (register G42)
      description: |
        The egress proxy's audit events for this sandbox, as the KVM host's proxy wrote them
        (`moca-egress`'s Event: time, via, vm_id, sid, sub, host, dial_addr, method, path without
        query, fragment or userinfo, status, bytes_up, bytes_down, credential NAME, decision,
        dropped, coalesced), in arrival order. The caller's own sandbox; admins may read any, as
        `GET /v1/sandboxes/{id}`. Kept as long as the sandbox record (SH_SANDBOX_RETENTION_SECONDS).

        Paths are logged without query, fragment or userinfo, and an injected credential appears by
        name only, but a secret a guest puts in a URL path segment is logged as sent.

        `format=ndjson` returns the whole log, one canonical JSON event per line, each ended by
        `\n`. Its sha256 is `summary.sha256`, and the sandbox's end record's `egress.sha256` (or a
        later `sandbox` record with `state: egress`, when events arrived after the end).
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/sandboxId' }
        - name: after
          in: query
          description: the previous page's `next`
          schema: { type: string, pattern: '^[0-9]{1,20}-[0-9]{1,20}$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: format
          in: query
          schema: { type: string, enum: [json, ndjson], default: json }
      responses:
        '200':
          description: a page of the log and its summary, or (format=ndjson) the whole log
          content:
            application/json:
              schema:
                type: object
                required: [events, next, summary]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/EgressEvent' } }
                  next:
                    {
                      type: [string, 'null'],
                      description: "the next page's `after`; null at the end",
                    }
                  summary: { $ref: '#/components/schemas/EgressSummary' }
            application/x-ndjson:
              schema: { type: string }
        '400':
          description: '`invalid_request`: a bad after, limit or format'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotEnrolled' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/janitor/sandboxes:
    get:
      operationId: janitorSandboxes
      summary: The host janitor's read -- every live and retained terminated sandbox
      description: |
        Sandbox service control planes only. Authenticated by `SH_JANITOR_TOKEN` alone, never a
        user's token, and refused with none configured (SBX0 §8.3). Carries only what the janitor
        needs to find a workspace tree.
      security: [{ janitorToken: [] }]
      responses:
        '200':
          description: live and terminated sandboxes
          content:
            application/json:
              schema:
                type: object
                required: [live, terminated]
                properties:
                  live:
                    type: array
                    items:
                      type: object
                      required: [wsk, wrk]
                      properties:
                        wsk: { type: string }
                        wrk: { type: string }
                  terminated:
                    type: array
                    items:
                      type: object
                      required: [wsk, wrk, terminatedAt]
                      properties:
                        wsk: { type: string }
                        wrk: { type: string }
                        terminatedAt: { type: integer, description: epoch seconds }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/egress/credential:
    post:
      operationId: lookupEgressCredential
      summary: moca-egress's owner lookup -- ready header values for a sandbox's outbound host
      description: |
        Sandbox service control planes with egress credentials configured only. Authenticated by
        a KVM host's egress token. Returns the sandbox OWNER's `sandbox-egress` credentials whose
        destination matches `host`, rendered to header values, sorted by port, then path prefix
        length descending, then name. Header values are never logged or audited (SBX0.2b §4.2).
      security: [{ egress: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sandbox, host]
              properties:
                sandbox: { type: string, pattern: '^sbx-[0-9a-f]{26}$' }
                host: { type: string, pattern: '^[A-Za-z0-9.-]{1,253}$' }
      responses:
        '200':
          description: the credentials for the host
          content:
            application/json:
              schema:
                type: object
                required: [subject, ttlSeconds, credentials]
                properties:
                  subject: { type: string }
                  ttlSeconds: { type: integer, minimum: 5 }
                  credentials:
                    type: array
                    items:
                      type: object
                      required: [name, port, pathPrefix, headers, expiresAt]
                      properties:
                        name: { type: string }
                        port: { type: integer }
                        pathPrefix: { type: string }
                        headers:
                          type: array
                          items:
                            type: object
                            required: [name, value]
                            properties:
                              name: { type: string }
                              value: { type: string }
                        expiresAt: { type: [string, 'null'], format: date-time }
        '400':
          description: invalid_request (bad sandbox id or host)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: "`sandbox_not_found` (unknown, terminated or another host's) or `no_credential`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: '`destination_ambiguous` or `credential_unsafe`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: redis_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /internal/credentials:
    post:
      operationId: exchangeCredential
      summary: Data-plane only — exchange a session token for that subject's credential
      description: |
        Not part of the public surface. Authenticated by the shared `SH_EXCHANGE_TOKEN`, fail-closed
        with none configured (spec §5.3.1). Puts the control plane on the CONTROL path once per turn,
        never on the data path: it sees no prompt and no model output.
      security: [{ exchangeToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: the session token presented by the caller }
      responses:
        '200':
          description: the resolved credential
          content:
            application/json:
              schema:
                type: object
                required: [mode, anthropicAuthToken, anthropicBaseUrl, sessionId, subject]
                properties:
                  mode:
                    type: string
                    enum: [placeholder, direct]
                    description: |
                      `placeholder` when the deployment has an injector to rewrite it; `direct` (MU1's
                      interim mode) when none is configured. Tagged, because a mislabelled credential
                      fails silently in both directions (spec §3.6).
                  anthropicAuthToken: { type: string }
                  anthropicBaseUrl:
                    { type: string, description: never absent — see endpoint_unresolved }
                  sessionId: { type: string }
                  subject: { type: string }
                  configRef:
                    { type: string, description: present only when the session has a config bundle }
                  sandboxTier:
                    type: string
                    description: |
                      the tier the session's turn runs in (P6.3): the recorded tier, or today's
                      default for a session that recorded none; absent whenever the deployment
                      declares no tiers, even for a session that recorded one
                  model:
                    type: object
                    description: |
                      the session's model and the limits recorded when it was chosen; absent when
                      the session names none (the data plane then uses its deployment default)
                    required: [id]
                    properties:
                      id: { type: string }
                      contextWindow: { type: integer }
                      maxTokens: { type: integer }
                      reasoning: { type: boolean }
                      vision: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
